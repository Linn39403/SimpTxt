[package]
name = "rust-notepad-prototype"
version = "0.1.0"
edition = "2024"
publish = false
[features]
default = ["native-glow"]
native-glow = ["eframe/glow"]
headless-capture = ["eframe/wgpu", "dep:image", "dep:pollster"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "x11", "wayland"] }
rfd = "0.17.2"
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pollster = { version = "0.4", optional = true }
[profile.dev]
debug = 0
incremental = false
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
[lints.rust]
unsafe_code = "forbid"
