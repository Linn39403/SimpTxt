name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Cargo downloads and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
          key: notepad-cargo-${{ matrix.os }}-${{ runner.arch }}-1.95.0-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            notepad-cargo-${{ matrix.os }}-${{ runner.arch }}-1.95.0-

      - name: Install Linux desktop and software rendering libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libssl-dev libx11-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri \
            libvulkan1 mesa-vulkan-drivers xvfb xauth

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint default targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test default targets
        run: cargo test --locked --all-targets

      - name: Test all features
        run: cargo test --locked --all-targets --all-features

      - name: Build the default desktop executable
        run: cargo build --locked

      # This captures production widgets offscreen, not an OS window/event loop.
      - name: Capture production UI with software Vulkan (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          WGPU_BACKEND: vulkan
        run: |
          export VK_DRIVER_FILES
          VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          bash tests/capture.sh
